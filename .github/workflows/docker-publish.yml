name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Import the application
        working-directory: backend
        env:
          DATA_DIR: /tmp/amisearch
          SECRET_KEY: ci-secret
          SCHEDULER_ENABLED: 'false'
        run: python -c "from app.main import app; print(f'{len(app.routes)} routes registered')"

      - name: Unit tests
        working-directory: backend
        env:
          DATA_DIR: /tmp/amisearch
          SECRET_KEY: ci-secret
          SCHEDULER_ENABLED: 'false'
        run: python tests/test_offline.py

      - name: Upgrade safety
        working-directory: backend
        env:
          DATA_DIR: /tmp/amisearch-migration
          SECRET_KEY: ci-secret
          SCHEDULER_ENABLED: 'false'
        run: python tests/test_migration.py

      - name: Backup and restore
        working-directory: backend
        env:
          SECRET_KEY: ci-secret
          SCHEDULER_ENABLED: 'false'
        run: python tests/test_backup.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npx tsc -b

      - name: Build
        working-directory: frontend
        run: npm run build

      # Tailwind silently ignores a class name it does not recognise, so an
      # invented one like h-4.5 ships icons at their intrinsic size with no
      # warning anywhere. This catches that before it reaches a screen.
      - name: Check for class names that generate no CSS
        run: python scripts/check_tailwind_classes.py

  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [test, frontend]
    # Pull requests get built for verification but never pushed.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      # Build provenance is not offered for user-owned private repositories,
      # and the step hard-fails rather than skipping. The image is already
      # pushed by this point, so gate it on visibility instead of letting a
      # green build report as failed.
      - name: Attest the build
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
