<!doctype html>
<html lang="en" data-theme="midnight" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="description" content="Price tracking and restock alerts for Japanese hobby shops." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>AmiSearch</title>
    <script>
      // Apply the stored theme before first paint so there is no flash.
      try {
        const saved = JSON.parse(localStorage.getItem('amisearch.appearance') || '{}')
        const root = document.documentElement
        if (saved.theme) root.dataset.theme = saved.theme
        const mode =
          saved.mode === 'system' || !saved.mode
            ? window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
            : saved.mode
        root.dataset.mode = mode
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
